<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guess the Word! 🎉</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Comic Sans MS', 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    background: #fff;
    border-radius: 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    padding: 28px 24px 32px;
    width: 100%;
    max-width: 480px;
    text-align: center;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 20px;
    font-weight: bold;
    color: #555;
  }
  .score { color: #2e9e5b; }
  .streak { color: #e8870c; }
  h1 {
    font-size: 24px;
    color: #5a4ad1;
    margin-bottom: 14px;
  }
  .picture {
    font-size: 120px;
    line-height: 1.1;
    margin: 10px 0 18px;
    user-select: none;
    animation: pop 0.4s ease;
  }
  .picrow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .speak {
    font-size: 30px;
    width: 58px;
    height: 58px;
    border: none;
    border-radius: 50%;
    background: #ffd24d;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    transition: transform 0.1s, background 0.2s;
  }
  .speak:hover { background: #ffc721; }
  .speak:active { transform: scale(0.9); }
  @keyframes pop {
    0% { transform: scale(0.4); opacity: 0; }
    70% { transform: scale(1.12); }
    100% { transform: scale(1); opacity: 1; }
  }
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 8px;
  }
  .options button {
    font-family: inherit;
    font-size: 22px;
    font-weight: bold;
    padding: 16px 10px;
    border: none;
    border-radius: 18px;
    background: #f0f1ff;
    color: #4338ca;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
    text-transform: capitalize;
  }
  .options button:hover:not(:disabled) { background: #e0e2ff; transform: translateY(-2px); }
  .options button:active:not(:disabled) { transform: scale(0.96); }
  .options button.correct { background: #34d399 !important; color: #fff; animation: shake-good 0.4s; }
  .options button.wrong { background: #f87171 !important; color: #fff; animation: shake-bad 0.4s; }
  .options button:disabled { cursor: default; opacity: 0.85; }
  @keyframes shake-good { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
  @keyframes shake-bad { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  .feedback {
    min-height: 34px;
    font-size: 26px;
    font-weight: bold;
    margin-top: 16px;
  }
  .next {
    margin-top: 14px;
    font-family: inherit;
    font-size: 20px;
    font-weight: bold;
    padding: 12px 32px;
    border: none;
    border-radius: 16px;
    background: #5a4ad1;
    color: #fff;
    cursor: pointer;
    visibility: hidden;
  }
  .next:hover { background: #4838b8; }
</style>
</head>
<body>
  <div class="card">
    <div class="topbar">
      <span class="score">⭐ <span id="score">0</span></span>
      <span class="streak">🔥 <span id="streak">0</span></span>
    </div>
    <h1>What is this? 🤔</h1>
    <div class="picrow">
      <div class="picture" id="picture">❓</div>
      <button class="speak" id="speakBtn" title="Say the word">🔊</button>
    </div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next" id="nextBtn">Next ➡️</button>
  </div>

<script>
  // word -> emoji "picture"
  const WORDS = {
    "dog": "🐕", "old": "👴", "hungry": "😋", "sun": "☀️", "goat": "🐐",
    "bear": "🐻", "young": "👶", "milkshake": "🥤", "moon": "🌙", "soft": "🧸",
    "horse": "🐴", "slow": "🐢", "hippo": "🦛", "bird": "🐦", "sleeping": "😴",
    "duck": "🦆", "fast": "🏃", "deer": "🦌", "dolphin": "🐬", "sandals": "👡",
    "giraffe": "🦒", "fat": "🐷", "thin": "🦴", "sheep": "🐑", "spider": "🕷️",
    "elevator": "🛗", "lion": "🦁", "small": "🐜", "big": "🐘", "cow": "🐮",
    "mouse": "🐭", "monkey": "🐵", "happy": "😄", "snail": "🐌", "elephant": "🐘",
    "cactus": "🌵"
  };

  const wordList = Object.keys(WORDS);
  let score = 0;
  let streak = 0;
  let answer = "";

  const picEl = document.getElementById("picture");
  const optsEl = document.getElementById("options");
  const fbEl = document.getElementById("feedback");
  const nextBtn = document.getElementById("nextBtn");
  const scoreEl = document.getElementById("score");
  const streakEl = document.getElementById("streak");

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function pick(n, exclude) {
    const pool = wordList.filter(w => w !== exclude);
    return shuffle(pool).slice(0, n);
  }

  function newRound() {
    answer = wordList[Math.floor(Math.random() * wordList.length)];
    picEl.textContent = WORDS[answer];
    picEl.style.animation = "none";
    void picEl.offsetWidth;
    picEl.style.animation = "pop 0.4s ease";

    const choices = shuffle([answer, ...pick(5, answer)]);
    optsEl.innerHTML = "";
    choices.forEach(word => {
      const btn = document.createElement("button");
      btn.textContent = word;
      btn.onclick = () => choose(btn, word);
      optsEl.appendChild(btn);
    });

    fbEl.textContent = "";
    nextBtn.style.visibility = "hidden";
  }

  function choose(btn, word) {
    const buttons = optsEl.querySelectorAll("button");
    buttons.forEach(b => b.disabled = true);

    if (word === answer) {
      btn.classList.add("correct");
      score++;
      streak++;
      fbEl.textContent = "🎉 Correct! Great job!";
      fbEl.style.color = "#2e9e5b";
    } else {
      btn.classList.add("wrong");
      streak = 0;
      fbEl.textContent = "❌ Oops! The word is below 👇";
      fbEl.style.color = "#dc2626";
      buttons.forEach(b => { if (b.textContent === answer) b.classList.add("correct"); });
    }
    scoreEl.textContent = score;
    streakEl.textContent = streak;
    nextBtn.style.visibility = "visible";
  }

  nextBtn.onclick = newRound;

  let femaleVoice = null;
  function loadVoice() {
    const voices = window.speechSynthesis.getVoices();
    const prefer = [
      "Google US English", "Microsoft Aria", "Microsoft Zira", "Microsoft Jenny",
      "Samantha", "Karen", "Moira", "Tessa", "Female"
    ];
    const en = voices.filter(v => /en/i.test(v.lang));
    for (const name of prefer) {
      const m = en.find(v => v.name.includes(name));
      if (m) { femaleVoice = m; return; }
    }
    femaleVoice = en[0] || voices[0] || null;
  }
  if ("speechSynthesis" in window) {
    loadVoice();
    window.speechSynthesis.onvoiceschanged = loadVoice;
  }

  function speakWord() {
    if (!answer || !("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(answer);
    u.lang = "en-US";
    u.rate = 0.85;
    u.pitch = 1.25;
    if (femaleVoice) u.voice = femaleVoice;
    window.speechSynthesis.speak(u);
  }
  document.getElementById("speakBtn").onclick = speakWord;

  newRound();
</script>
</body>
</html>
